name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if not present)
        run: npx cap add android || true

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Install Android SDK (manual, with retry)
        run: |
          SDK=$ANDROID_HOME
          mkdir -p "$SDK/cmdline-tools"
          echo "== 下载 commandlinetools (重试 4 次) =="
          for i in 1 2 3 4; do
            if curl -L --retry 5 --retry-delay 5 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip; then
              echo "下载成功"; break
            fi
            echo "第 $i 次下载失败，5 秒后重试"; sleep 5
          done
          echo "== 解压 =="
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK"
          "$SDK/cmdline-tools/latest/bin/sdkmanager --version"
          echo "== 接受 licenses =="
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          echo "== 安装 platform & build-tools =="
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build debug APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overspend-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
