name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Add Android platform (if not present)
        run: npx cap add android || true

      - name: Sync web assets into native project
        run: npx cap sync android

      - name: Setup Android SDK (android-actions)
        id: setupsdk
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
        continue-on-error: true

      - name: Fallback - manual Android SDK install
        if: steps.setupsdk.outcome == 'failure'
        env:
          ANDROID_HOME: ${{ github.workspace }}/android-sdk
        run: |
          set -x
          SDK="$ANDROID_HOME"
          mkdir -p "$SDK/cmdline-tools"
          for i in 1 2 3 4 5; do
            if curl -L --retry 5 --retry-delay 5 -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip; then
              echo "download ok"; break
            fi
            echo "attempt $i failed, retry"; sleep 8
          done
          ls -l /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: |
          echo "sdk.dir=${ANDROID_HOME:-$HOME/Android/Sdk}" > android/local.properties
          cd android && chmod +x ./gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: overspend-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
